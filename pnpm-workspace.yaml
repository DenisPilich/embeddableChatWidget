# Рабочее пространство pnpm: какие папки являются пакетами монорепо.
# Благодаря этому `pnpm install` в корне ставит зависимости сразу всем пакетам,
# а пакеты могут ссылаться друг на друга по имени (@ecw/shared) без публикации в npm.
packages:
  - packages/*
  - apps/*

# pnpm по умолчанию НЕ выполняет сборочные скрипты зависимостей. Это защита от
# подмены пакета, который при установке запускает произвольный код.
#
# Настройка называется allowBuilds: в pnpm 11 прежние onlyBuiltDependencies и
# родственные им параметры удалены. Список намеренно короткий — всё, что здесь
# не названо, права запускать код при установке не получает.
#
# Перечисленным пакетам скрипты нужны по делу:
#   * prisma и @prisma/engines — скачивают движки для работы с базой;
#   * @prisma/client — готовит клиент по схеме;
#   * esbuild и sharp — подбирают исполняемый файл под платформу.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
