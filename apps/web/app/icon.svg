<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Embeddable Chat Widget">
  <title>Embeddable Chat Widget</title>
  <defs>
    <linearGradient id="bubble" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fbbf24" />
      <stop offset="1" stop-color="#f97316" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#1b2350" />
      <stop offset="1" stop-color="#0b1020" />
    </radialGradient>
  </defs>

  <!-- Ночной фон: тот же, что у страниц проекта. -->
  <rect width="64" height="64" rx="14" fill="url(#glow)" />

  <!-- Пузырь разговора с хвостиком. -->
  <path
    d="M32 13c-9.9 0-18 6.8-18 15.2 0 4.7 2.6 8.9 6.7 11.7V48l7.6-3.9c1.2.2 2.4.3 3.7.3 9.9 0 18-6.8 18-15.2S41.9 13 32 13z"
    fill="url(#bubble)"
  />

  <!-- Три точки: чат, а не просто облако. -->
  <circle cx="24.4" cy="28.4" r="2.5" fill="#11162b" />
  <circle cx="32" cy="28.4" r="2.5" fill="#11162b" />
  <circle cx="39.6" cy="28.4" r="2.5" fill="#11162b" />
</svg>
